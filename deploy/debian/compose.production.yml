name: oficina-production

services:
  postgres:
    image: ${DOCKER_LIBRARY_REGISTRY:-docker.io}/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  redis:
    image: ${DOCKER_LIBRARY_REGISTRY:-docker.io}/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: ${DOCKER_LIBRARY_REGISTRY:-docker.io}
      target: build
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL com a senha codificada para URL}
    command:
      - /bin/sh
      - -ec
      - pnpm --filter @oficina/database run migrate:deploy && pnpm --filter @oficina/database run seed
    networks: [internal]

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: ${DOCKER_LIBRARY_REGISTRY:-docker.io}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL com a senha codificada para URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Defina SETTINGS_ENCRYPTION_KEY}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      INVITE_TOKEN_TTL_SECONDS: ${INVITE_TOKEN_TTL_SECONDS:-604800}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      CORS_ORIGIN: ${PUBLIC_FRONTEND_URL:-http://localhost:3005}
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3005}
      PUBLIC_API_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3006}
      WA_AKG_ALLOWED_HOSTS: ${WA_AKG_ALLOWED_HOSTS:-chat.axcloud.com.br}
      UPLOAD_DIR: /app/uploads
      BACKEND_PORT: 3001
      SAAS_ADMIN_USER_IDS: ${SAAS_ADMIN_USER_IDS:-}
      # Real client IP for rate limits, set by Cloudflare. Safe because the API port is bound to 127.0.0.1.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      PLATFORM_SMTP_URL: ${PLATFORM_SMTP_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      PLATFORM_MAIL_FROM: ${PLATFORM_MAIL_FROM:-}
    volumes:
      - service_order_uploads:/app/uploads
    ports:
      # Only on the host itself: from outside, everything goes through Cloudflare and Caddy (headers, real client IP).
      # Docker publishes ports past UFW, so 0.0.0.0 here would expose the API directly to the internet.
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-3006}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        DOCKER_LIBRARY_REGISTRY: ${DOCKER_LIBRARY_REGISTRY:-docker.io}
        NEXT_PUBLIC_API_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3006}
        NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${NEXT_PUBLIC_LEGAL_COMPANY_NAME:-}
        NEXT_PUBLIC_LEGAL_COMPANY_DOCUMENT: ${NEXT_PUBLIC_LEGAL_COMPANY_DOCUMENT:-}
        NEXT_PUBLIC_LEGAL_COMPANY_ADDRESS: ${NEXT_PUBLIC_LEGAL_COMPANY_ADDRESS:-}
        NEXT_PUBLIC_PRIVACY_EMAIL: ${NEXT_PUBLIC_PRIVACY_EMAIL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-3005}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]

  # Ponto único de entrada atrás do Cloudflare Tunnel (cloudflared). O
  # Cloudflare termina o HTTPS público na borda; daqui pra dentro é HTTP
  # simples, por isso só publica em 127.0.0.1 — nada além do cloudflared
  # rodando no próprio host deve conseguir falar com esta porta.
  caddy:
    image: ${DOCKER_LIBRARY_REGISTRY:-docker.io}/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    profiles: [tunnel]
    ports:
      - "127.0.0.1:3010:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  service_order_uploads:
