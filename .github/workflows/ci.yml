name: CI

on:
  pull_request:
  push:
    branches: [master, main, develop]

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Feature 2 (IAM) faz o backend conectar de verdade no Postgres/Redis já
    # no boot (PrismaService.onModuleInit, BullMQ) — sem esses serviços o
    # app nem inicializa, e os testes de integração/E2E precisam de dados
    # reais (migrations + seed dos papéis fixos).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina_ci_password
          POSTGRES_DB: oficina_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://oficina:oficina_ci_password@localhost:5432/oficina_saas?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_secret_do_not_use_in_prod
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate Debian deployment files
        run: |
          docker compose \
            --env-file deploy/debian/.env.production.example \
            -f deploy/debian/compose.production.yml config --quiet
          bash -n deploy/debian/deploy.sh
          bash -n deploy/debian/backup.sh
          DOCKER_LIBRARY_REGISTRY=mirror.gcr.io docker compose \
            --env-file deploy/debian/.env.production.example \
            -f deploy/debian/compose.production.yml config --quiet

      - name: Generate Prisma Client
        run: pnpm --filter @oficina/database run generate

      - name: Run database migrations
        run: pnpm --filter @oficina/database run migrate:deploy

      - name: Seed database (fixed roles/permissions)
        run: pnpm --filter @oficina/database run seed

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  docker-smoke-test:
    name: Docker images build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina_ci_password
          POSTGRES_DB: oficina_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oficina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @oficina/database run migrate:deploy
        env:
          DATABASE_URL: postgresql://oficina:oficina_ci_password@localhost:5432/oficina_saas?schema=public

      - name: Build backend image (Google cache)
        run: docker build --build-arg DOCKER_LIBRARY_REGISTRY=mirror.gcr.io -f backend/Dockerfile -t oficina-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t oficina-frontend:ci .

      - name: Boot backend and check /health
        run: |
          # --network host: o container do backend precisa alcançar os
          # services (postgres/redis) publicados em localhost pelo runner.
          docker run -d --name backend-smoke --network host \
            -e DATABASE_URL="postgresql://oficina:oficina_ci_password@localhost:5432/oficina_saas?schema=public" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="ci_test_secret_do_not_use_in_prod" \
            -e BACKEND_PORT=3001 \
            oficina-backend:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:3001/health && exit 0
            sleep 2
          done
          echo "backend never became healthy"
          docker logs backend-smoke
          exit 1

      - name: Boot frontend and check /
        run: |
          docker run -d --name frontend-smoke --network host oficina-frontend:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "frontend never became healthy"
          docker logs frontend-smoke
          exit 1
